# Namespace-agnostic controller configuration for the Franka FR3 ultrasound workflow.

/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces:
          robot_state

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      ultrasound_scanning_impedance_controller:
        type: franka_example_controllers/UltrasoundScanningImpedanceController

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      lock_try_count: 5
      lock_sleep_interval: 5
      lock_log_error: true
      lock_update_success: false

/**:
  ultrasound_scanning_impedance_controller:
    ros__parameters:
      robot_type: fr3
      arm_prefix: ""

      # Translation in the flange/probe frame.
      translational_stiffness:
        x: 0.0
        y: 0.0
        z: 400.0
      translational_damping:
        x: 10.0
        y: 10.0
        z: 70.0

      # Rotation in the flange/probe frame: free roll, constrained pitch/yaw.
      rotational_stiffness:
        x: 0.0
        y: 30.0
        z: 30.0
      rotational_damping:
        x: 1.0
        y: 6.0
        z: 6.0

      # Normal-force admittance control along flange +Z.
      force_normal_desired: 5.0
      force_filter_cutoff_hz: 20.0
      admittance_gain: 0.0002
      normal_v_max: 0.02
      normal_max_disp: 0.02

      # Nullspace stabilization.
      nullspace_stiffness: 15.0
      nullspace_damping: 3.0

      # Safety limits.
      max_force_xy: 30.0
      max_force_z: 80.0
      max_torque_xyz: 20.0
      max_joint_torque: 80.0
      max_delta_tau: 1.0

      # Runtime monitoring.
      status_topic: "ultrasound_scanning_impedance/status"
      status_publish_rate_hz: 20.0
