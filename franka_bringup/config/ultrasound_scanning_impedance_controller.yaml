# Ultrasound Scanning Impedance Controller – parameter file
#
# All translational and rotational gains are defined in the flange/probe frame.
#
# Stiffness matrix K = diag(K_tx, K_ty, K_tn, K_rx, K_ry, K_rz)  [flange frame]
# Damping   matrix D = diag(D_tx, D_ty, D_tn, D_rx, D_ry, D_rz)  [flange frame]
#
# Phase 1 – Translation (flange frame)
#   Tangent (flange X/Y): Near-zero stiffness + moderate damping → hand-guiding
#   Normal  (flange Z):   High stiffness for admittance force-tracking loop
#
# Phase 2 – Rotation (flange frame)
#   Roll  (X): Free  → probe adapts to body curvature
#   Pitch (Y): Locked → initial orientation preserved
#   Yaw   (Z): Locked → prevents probe spinning during drag

/**:
  ultrasound_scanning_impedance_controller:
    ros__parameters:
      robot_type: fr3
      arm_prefix: ""

      # ---- Phase 1: Translational gains (flange frame) ----
      translational_stiffness:
        x: 0.0      # [N/m]  tangent – free hand-guiding
        y: 0.0      # [N/m]  tangent – free hand-guiding
        z: 400.0    # [N/m]  normal – admittance loop reference tracking

      translational_damping:
        x: 10.0     # [N·s/m]  tangent – moderate damping for smooth drag
        y: 10.0     # [N·s/m]  tangent
        z: 70.0     # [N·s/m]  normal – high damping for stability

      # ---- Phase 2: Rotational gains (flange frame) ----
      rotational_stiffness:
        x: 0.0      # [Nm/rad]  free roll
        y: 30.0     # [Nm/rad]  locked pitch
        z: 30.0     # [Nm/rad]  locked yaw

      rotational_damping:
        x: 1.0      # [Nm·s/rad]  light roll damping
        y: 6.0      # [Nm·s/rad]
        z: 6.0      # [Nm·s/rad]

      # ---- Normal-force control (admittance, flange +Z) ----
      force_normal_desired: 5.0       # [N]  desired normal contact force (pressing-positive)
      force_filter_cutoff_hz: 20.0    # [Hz] low-pass filter cutoff on measured force
      admittance_gain: 0.0002         # [m/s / N]  velocity per unit force error
      normal_v_max: 0.02              # [m/s]  max admittance velocity along normal
      normal_max_disp: 0.02           # [m]    max admittance displacement along normal

      # ---- Nullspace stabilization ----
      nullspace_stiffness: 15.0       # [Nm/rad]
      nullspace_damping: 3.0          # [Nm·s/rad]

      # ---- Safety limits ----
      max_force_xy: 30.0              # [N]
      max_force_z: 80.0               # [N]
      max_torque_xyz: 20.0            # [Nm]
      max_joint_torque: 80.0          # [Nm]
      max_delta_tau: 1.0              # [Nm]  per-cycle torque rate limit

      # ---- Monitoring ----
      status_topic: "ultrasound_scanning_impedance/status"
      status_publish_rate_hz: 20.0    # [Hz]
